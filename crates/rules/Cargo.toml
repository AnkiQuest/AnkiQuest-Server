[package]
name = "ankiquest-rules"
version = "0.1.0"
authors = ["hill <hill@hilll.dev>"]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "The rules AnkiQuest's server and clients compute alike, with UniFFI bindings for Kotlin and Python"

# `lib` for the server, `cdylib` for the Kotlin and Python bindings.
[lib]
crate-type = ["lib", "cdylib"]

[features]
# UniFFI exports for the bindings. The server builds without them.
ffi = ["dep:uniffi"]
# The server's JSON names for the types.
serde = ["dep:serde"]
# The `uniffi-bindgen` binary that writes the Kotlin and Python sources.
bindgen = ["ffi", "uniffi/cli"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
uniffi = { version = "0.32.2", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]
