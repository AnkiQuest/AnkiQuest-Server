[package]
name = "ankiquest-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Repository tools: the Android API contract guard, and the Android and add-on art exporters"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ankiquest-art = { path = "../art" }
color_quant = "2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18"
serde_json = "1"
sha2 = "0.11"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
