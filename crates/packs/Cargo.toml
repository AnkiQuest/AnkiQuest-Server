[package]
name = "ankiquest-packs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Checks an uploaded companion pack and rebuilds it from decoded pixels"
publish = false

[dependencies]
ankiquest-art = { path = "../art" }
crc32fast = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
webp = { version = "0.3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
# zip inflates through flate2; this picks its pure-Rust backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

