name: CI

on:
  # Pushes to the default branch, every pull request and every merge queue
  # group. Pushes to other branches are left to their pull request: checking
  # both ran every job twice on the same commit.
  push:
    branches:
      - main
      - master
  pull_request:
  # The jobs here are required checks; the merge queue waits for them on
  # its temporary merge commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run
  # (default branch pushes, dispatches, merge queue) gets a group of its own
  # and always finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test the compatibility guard
        run: cargo test -p ankiquest-xtask contract
      - name: Read Android's public consumed-example catalog
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch main https://github.com/AnkiQuest/AnkiQuest-Android.git android-client
          git -C android-client sparse-checkout set --no-cone \
            '/AnkiDroid/src/test/resources/ankiquest-api/' '/AnkiDroid/src/test/resources/ankiquest-server.sha' \
            '/ankiquest-core/src/test/resources/ankiquest-api/' '/ankiquest-core/src/test/resources/ankiquest-server.sha'
      - name: Preserve Android's consumed API shapes
        run: |
          resources=android-client/AnkiDroid/src/test/resources
          # Select by the committed module, so a missing catalog or pin still fails the guard.
          if git -C android-client cat-file -e HEAD:ankiquest-core 2>/dev/null; then
            resources=android-client/ankiquest-core/src/test/resources
          fi
          cargo run -p ankiquest-xtask -- android-contract --android-resources "$resources"

  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The art backlog (#57); informational until every live companion
      # has every pose.
      - name: Report missing poses
        run: cargo run -p ankiquest-xtask -- art-coverage --missing | tee -a "$GITHUB_STEP_SUMMARY"

      # A pose added to companion_poses.json needs a master for every live
      # companion. Comparing with the base commit's list keeps existing
      # gaps from failing. `event-base` picks the pull request's, the
      # merge group's or the push's base.
      - name: Check added poses are drawn
        run: |
          BASE=$(cargo run -q -p ankiquest-xtask -- event-base)
          git fetch --depth=1 origin "$BASE"
          git show "$BASE:tests/fixtures/companion_poses.json" > "$RUNNER_TEMP/base-poses.json"
          cargo run -p ankiquest-xtask -- art-coverage --since "$RUNNER_TEMP/base-poses.json"

  web:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: |
          bash .github/scripts/ubuntu-archive.sh
          npm ci && npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Build the server
        run: rustup target add wasm32-unknown-unknown && cargo build

      - name: Browser tests
        run: npm run test:web

  # Regenerates the web screenshots, the README banner and the social
  # preview, and fails unless they are byte-identical to the committed
  # files. On failure the rendered images are uploaded for review.
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright's Chromium
        run: |
          bash .github/scripts/ubuntu-archive.sh
          npm ci && npx playwright install --with-deps chromium

      # The pages load the i18n module built for wasm.
      - name: Regenerate
        run: rustup target add wasm32-unknown-unknown && npm run screenshots

      - name: Compare with the committed images
        run: git diff --exit-code --stat -- docs/screenshots/web docs/graphics

      - name: Upload the rendered images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: |
            docs/screenshots/web/*.png
            docs/graphics/*.png

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Test
        run: nix develop --command cargo test --workspace

      - name: Lint
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package
        run: nix build --print-build-logs

      - name: Evaluate the NixOS module
        run: |
          # The module with a player tokenFile, plus the settings in $1.
          evaluate() {
            nix eval --impure --raw --expr '
              let
                flake = builtins.getFlake "git+file://'"$PWD"'";
                system = flake.inputs.nixpkgs.lib.nixosSystem {
                  system = "x86_64-linux";
                  modules = [
                    flake.nixosModules.default
                    {
                      boot.isContainer = true;
                      system.stateVersion = "26.05";
                      services.nginx.enable = true;
                      security.acme.acceptTerms = true;
                      security.acme.defaults.email = "ci@example.com";
                      services.ankiquest = {
                        enable = true;
                        domain = "anki.example.com";
                        privateSite = true;
                        sitePasswordFile = "/run/secrets/ankiquest-site-password";
                        ntfy = "https://ntfy.sh";
                        users.hill = {
                          ntfyTopic = "example";
                          tokenFile = "/run/secrets/ankiquest-hill";
                        };
                      } // '"$1"';
                    }
                  ];
                };
              in system.config.system.build.toplevel.drvPath'
          }
          evaluate '{ configuredTokens = "enabled"; }'

          # Configured tokens are opt-in: without it the tokenFile is an error.
          if evaluate '{ }' 2> refused.log; then
            echo "a tokenFile without configuredTokens evaluated" >&2
            exit 1
          fi
          grep -q configuredTokens refused.log || { cat refused.log; exit 1; }
