name: CI

on:
  # Pushes to the default branch, every pull request and every merge queue
  # group. Pushes to other branches are left to their pull request: checking
  # both ran every job twice on the same commit.
  push:
    branches:
      - master
  pull_request:
  # The jobs here are required checks; the merge queue waits for them on
  # its temporary merge commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run
  # (default branch pushes, dispatches, merge queue) gets a group of its own
  # and always finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches anything besides documentation, from
  # AnkiQuest-Dev's code-changed action. Only Markdown and licence files
  # count as documentation: the tests read the rest of docs/ (API
  # examples, screenshots, banner, the art guard's image search). `web`
  # also counts AGENTS.md and CLAUDE.md as code, since
  # tests/agents.test.ts reads them. The jobs below run unless an output
  # is 'false', so a failed `changes` job runs everything; a job skipped
  # by its `if` counts as a passing required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      web: ${{ steps.web.outputs.code }}
    steps:
      - id: code
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@5ab685e7013b865630f96530ca8c654344738fa8
        with:
          docs: |
            **/*.md
            LICENSE*
            LICENSES/**
            .github/ISSUE_TEMPLATE/**
            .github/pull_request_template.md
      - id: web
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@5ab685e7013b865630f96530ca8c654344738fa8
        with:
          docs: |
            README.md
            docs/**/*.md
            static/**/*.md
            LICENSE*
            LICENSES/**
            .github/ISSUE_TEMPLATE/**
            .github/pull_request_template.md

  android-contract:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test the compatibility guard
        run: cargo test -p ankiquest-xtask contract
      # Android tests against server master, so the shapes to keep are the
      # base commit's; `event-base` picks the pull request's, the merge
      # group's or the push's base. Android's catalog names what it reads.
      - name: Read Android's public consumed-example catalog
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch master https://github.com/AnkiQuest/AnkiQuest-Android.git android-client
          git -C android-client sparse-checkout set --no-cone \
            '/AnkiDroid/src/test/resources/ankiquest-api/names.json' \
            '/ankiquest-core/src/test/resources/ankiquest-api/names.json'
      - name: Read the base commit's examples
        run: |
          BASE=$(cargo run -q -p ankiquest-xtask -- event-base)
          git fetch --depth=1 origin "$BASE"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE" docs/api/examples | tar -x -C "$RUNNER_TEMP/base"
      - name: Preserve Android's consumed API shapes
        run: |
          catalog=android-client/AnkiDroid/src/test/resources/ankiquest-api/names.json
          # Select by the committed module, so a missing catalog still fails the guard.
          if git -C android-client cat-file -e HEAD:ankiquest-core 2>/dev/null; then
            catalog=android-client/ankiquest-core/src/test/resources/ankiquest-api/names.json
          fi
          cargo run -p ankiquest-xtask -- android-contract --android-catalog "$catalog" \
            --baseline "$RUNNER_TEMP/base/docs/api/examples"

  art:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The companion art masters: the pinned AnkiQuest-Art release,
      # downloaded and hash-checked by the tool below; never a submodule.
      - name: Stage the pinned art release
        run: node tests/tools/stage-art.mjs .
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The art backlog (#57, #116); informational: live companions with
      # missing core items show the fixture's fallbacks (hill, 2026-11-21).
      - name: Report missing poses
        run: cargo run -p ankiquest-xtask -- art-coverage --missing | tee -a "$GITHUB_STEP_SUMMARY"

      # An item (core mood, picture, icon or extension) added to
      # companion_poses.json needs a master for every live companion. Comparing with the base commit's list keeps existing
      # gaps from failing. `event-base` picks the pull request's, the
      # merge group's or the push's base.
      - name: Check added poses are drawn
        run: |
          BASE=$(cargo run -q -p ankiquest-xtask -- event-base)
          git fetch --depth=1 origin "$BASE"
          git show "$BASE:tests/fixtures/companion_poses.json" > "$RUNNER_TEMP/base-poses.json"
          cargo run -p ankiquest-xtask -- art-coverage --since "$RUNNER_TEMP/base-poses.json"

  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The companion art masters: the pinned AnkiQuest-Art release,
      # downloaded and hash-checked by the tool below; never a submodule.
      - name: Stage the pinned art release
        run: node tests/tools/stage-art.mjs .

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: |
          bash .github/scripts/ubuntu-archive.sh
          npm ci && npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Build the server
        run: rustup target add wasm32-unknown-unknown && cargo build

      - name: Browser tests
        run: npm run test:web

  # Regenerates the web screenshots and fails unless they are
  # byte-identical to the committed files. On failure the rendered images
  # are uploaded for review.
  screenshots:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The companion art masters: the pinned AnkiQuest-Art release,
      # downloaded and hash-checked by the tool below; never a submodule.
      - name: Stage the pinned art release
        run: node tests/tools/stage-art.mjs .

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright's Chromium
        run: |
          bash .github/scripts/ubuntu-archive.sh
          npm ci && npx playwright install --with-deps chromium

      # The pages load the i18n module built for wasm.
      - name: Regenerate
        run: rustup target add wasm32-unknown-unknown && npm run screenshots:web

      - name: Compare with the committed images
        run: git diff --exit-code --stat -- docs/screenshots/web

      - name: Upload the rendered images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/web/*.png

  # The README banner and social preview, drawn from the committed web
  # screenshots and the duo master of the pinned AnkiQuest-Art release by
  # AnkiQuest-Dev's shared tool (docs/graphics/banner.toml).
  banner:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/banner.yml@master

  # Rust format, tests and clippy in the flake's dev shell, the flake check
  # and alejandra, through AnkiQuest-Dev's shared Nix check. It reports as
  # `nix / check`.
  nix:
    needs: changes
    if: ${{ !cancelled() }}
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/nix-check.yml@master
    with:
      # Reports `nix / check` as passed without running it on docs-only changes.
      skip: ${{ needs.changes.outputs.code == 'false' }}
      rust-cache: true
      timeout-minutes: 45
      # build.rs reads the art masters from the staged AnkiQuest-Art
      # release (ankiquest-art.json), which the shared check does not
      # check out and Nix does not fetch.
      run: |
        node tests/tools/stage-art.mjs .
        cargo fmt --all --check
        cargo test --workspace
        cargo clippy --workspace --all-targets -- -D warnings

  package:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The companion art masters: the pinned AnkiQuest-Art release,
      # downloaded and hash-checked by the tool below; never a submodule.
      - name: Stage the pinned art release
        run: node tests/tools/stage-art.mjs .

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package
        run: nix build --print-build-logs

      - name: Evaluate the NixOS module
        run: |
          # The module with a player tokenFile, plus the settings in $1.
          evaluate() {
            nix eval --impure --raw --expr '
              let
                # shallow=1: the checkout is shallow.
                flake = builtins.getFlake "git+file://'"$PWD"'?shallow=1";
                system = flake.inputs.nixpkgs.lib.nixosSystem {
                  system = "x86_64-linux";
                  modules = [
                    flake.nixosModules.default
                    {
                      boot.isContainer = true;
                      system.stateVersion = "26.05";
                      services.nginx.enable = true;
                      security.acme.acceptTerms = true;
                      security.acme.defaults.email = "ci@example.com";
                      services.ankiquest = {
                        enable = true;
                        domain = "anki.example.com";
                        privateSite = true;
                        sitePasswordFile = "/run/secrets/ankiquest-site-password";
                        ntfy = "https://ntfy.sh";
                        users.hill = {
                          ntfyTopic = "example";
                          tokenFile = "/run/secrets/ankiquest-hill";
                        };
                      } // '"$1"';
                    }
                  ];
                };
              in system.config.system.build.toplevel.drvPath'
          }
          evaluate '{ configuredTokens = "enabled"; }'

          # Configured tokens are opt-in: without it the tokenFile is an error.
          if evaluate '{ }' 2> refused.log; then
            echo "a tokenFile without configuredTokens evaluated" >&2
            exit 1
          fi
          grep -q configuredTokens refused.log || { cat refused.log; exit 1; }
