# Publishes the shared rules as a release when a master commit builds bytes
# the latest release does not have (docs/shared-rules.md). The Shared rules
# workflow builds and tests everything (each library twice, the fixture
# cases on every platform); this one names the assets and publishes
# rules-<N> (one more than the highest rules-* tag) with their SHA256SUMS.
# Consumers take the newest rules-<N> release when they build.
name: Rules release

on:
  push:
    branches:
      - master
    paths:
      - crates/rules/**
      - crates/rules-wasm/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rules.yml
      - .github/workflows/rules-release.yml
  workflow_dispatch:

# Publishing runs one at a time and is never cancelled.
concurrency:
  group: rules-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rules:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/rules.yml

  release:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ankiquest-rules-*
          path: ${{ runner.temp }}/artifacts

      # One file per asset: the module, the Python and Kotlin bindings, each
      # desktop library named after its platform and each Android library
      # named after its ABI.
      - name: Name the assets
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          cp ankiquest-rules-wasm/ankiquest_rules.wasm "$assets/"
          cp ankiquest-rules-bindings/python/ankiquest_rules.py "$assets/"
          cp ankiquest-rules-bindings/kotlin/org/ankiquest/rules/ankiquest_rules.kt "$assets/"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "ankiquest-rules-android/jniLibs/$abi/libankiquest_rules.so" "$assets/libankiquest_rules-android-$abi.so"
          done
          for platform in linux-x86_64 linux-aarch64 windows-x86_64 macos-arm64 macos-x86_64; do
            for lib in ankiquest-rules-$platform/*ankiquest_rules.*; do
              case "$lib" in *.py) continue ;; esac
              name=${lib##*/}
              cp "$lib" "$assets/${name%.*}-$platform.${name##*.}"
            done
          done
          cd "$assets"
          sha256sum ./* | sed 's| \./| |' | sort -k 2 > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          [ "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")" -eq 12 ]
          cp "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS

      # Releases only new bytes: a change that leaves every asset as it was,
      # or a rerun, publishes nothing.
      - name: Choose the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/rules-*' \
            | sed -n 's|.*refs/tags/rules-\([0-9][0-9]*\)$|\1|p' | sort -n | tail -n 1)
          if [ -n "$last" ]; then
            gh release download "rules-$last" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/last"
            if sort -k 2 "$RUNNER_TEMP/last/SHA256SUMS" | cmp -s - "$RUNNER_TEMP/SHA256SUMS"; then
              echo "rules-$last has these bytes already"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=rules-$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          {
            echo "The shared rules, built from AnkiQuest-Server $GITHUB_SHA: the WebAssembly module,"
            echo "the Python and Kotlin bindings, the desktop libraries and the Android libraries."
            echo
            echo "SHA-256 of each asset:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest=false ./*
