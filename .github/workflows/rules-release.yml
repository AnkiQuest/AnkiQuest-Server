# Publishes the shared rules' WebAssembly module as a release when a
# master commit builds bytes the latest release does not have
# (docs/shared-rules.md): ankiquest_rules.wasm, SHA256SUMS and
# ankiquest-rules.json, the pin file consumers commit. Tags are
# rules-<N>, one more than the highest rules-* tag.
name: Rules release

on:
  push:
    branches:
      - master
    paths:
      - crates/rules/**
      - crates/rules-wasm/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rules-release.yml
  workflow_dispatch:

# Publishing runs one at a time and is never cancelled.
concurrency:
  group: rules-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and the wasm target
        working-directory: crates/rules
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      - name: Build twice and compare
        run: |
          crates/rules-wasm/build.sh "$RUNNER_TEMP/assets"
          crates/rules-wasm/build.sh "$RUNNER_TEMP/again"
          diff "$RUNNER_TEMP/assets/SHA256SUMS" "$RUNNER_TEMP/again/SHA256SUMS"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run the fixture cases through the module
        env:
          ANKIQUEST_RULES_WASM: ${{ runner.temp }}/assets/ankiquest_rules.wasm
        run: node --experimental-strip-types --no-warnings=ExperimentalWarning --test crates/rules-wasm/tests/*.test.ts

      # Releases only new bytes: a change that leaves the module as it was,
      # or a rerun, publishes nothing.
      - name: Choose the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/rules-*' \
            | sed -n 's|.*refs/tags/rules-\([0-9][0-9]*\)$|\1|p' | sort -n | tail -n 1)
          if [ -n "$last" ]; then
            gh release download "rules-$last" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/last"
            if cmp -s "$RUNNER_TEMP/last/SHA256SUMS" "$RUNNER_TEMP/assets/SHA256SUMS"; then
              echo "rules-$last has these bytes already"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=rules-$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Write the pin file
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          jq -n --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
            --arg wasm "$(cut -d ' ' -f 1 SHA256SUMS)" \
            '{_about: "The AnkiQuest-Server rules release this repository uses (docs/shared-rules.md in AnkiQuest-Server). Do not edit it by hand.",
              tag: $tag, commit: $commit, assets: {"ankiquest_rules.wasm": $wasm}}' > ankiquest-rules.json
          cat ankiquest-rules.json

      - name: Publish
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          {
            echo "The shared rules' WebAssembly module, built from AnkiQuest-Server $GITHUB_SHA."
            echo
            echo "SHA-256 of each asset:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest=false ./*
