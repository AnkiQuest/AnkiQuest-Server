name: Pull Request Labels

# Keeps pull request labels current:
# - area labels from the changed paths (.github/labeler.yml)
# - "Needs Review" while a pull request is open and not a draft
# - "New contributor" on a first pull request from someone new to the repo
# - workflow labels are cleared when a pull request is closed
#
# pull_request_target runs the base branch's workflow with a token that can
# label pull requests from forks. Nothing here checks out or runs pull
# request code: the jobs only read the event payload and the GitHub API.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  # A merge queue group has no pull request to label. Both jobs are skipped
  # there, which counts as passing, so the queue never waits for them.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  area:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  status:
    if: github.event_name == 'pull_request_target' && github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            // Label names are case-insensitive on GitHub.
            const has = (name) => pr.labels.some((label) => label.name.toLowerCase() === name.toLowerCase());

            async function add(name) {
              if (has(name)) return;
              core.info(`Adding "${name}"`);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            }

            async function remove(name) {
              if (!has(name)) return;
              core.info(`Removing "${name}"`);
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            switch (context.payload.action) {
              case 'closed':
                await remove('Needs Review');
                await remove('Has Conflicts');
                break;
              case 'converted_to_draft':
                await remove('Needs Review');
                break;
              default: // opened, reopened, ready_for_review
                if (!pr.draft) await add('Needs Review');
            }

            const newcomer = ['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'NONE'];
            if (context.payload.action === 'opened' && newcomer.includes(pr.author_association)) {
              await add('New contributor');
            }
