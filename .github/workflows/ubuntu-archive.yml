name: Ubuntu mirror selector

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run
  # (default branch pushes, dispatches, merge queue) gets a group of its own
  # and always finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Uses local HTTP responses and real curl; does not need apt or npm packages.
      - run: node --experimental-strip-types --test tests/tools/ubuntu-archive.test.ts
