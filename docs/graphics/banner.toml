# Inputs of the README banner and the social preview. AnkiQuest-Dev's
# ankiquest-banner draws both from them; see the README.

title = "AnkiQuest"
tagline = "Study together, keep your streak"

# Regenerates docs/screenshots/web/*.png (Linux).
record = ["npm", "run", "screenshots:web"]

readme = "docs/graphics/banner_readme.png"
social = "docs/graphics/social_preview.png"

# The pose master, in the art submodule of this repository (--server .).
[companion]
pose = "art/duo/friends.png"
height = 138

# Back to front, so nearer windows cover the ones behind them: Today and
# Community high at the sides, Friends lower in the middle, and the
# leaderboard, the site's front page, in front.

[[screen]]
frame = "browser"
shot = "docs/screenshots/web/today.png"
address = "ankiquest.example/today"
x = 24
y = 178
width = 440
max_height = 600

[[screen]]
frame = "browser"
shot = "docs/screenshots/web/friends.png"
address = "ankiquest.example/friends"
x = 168
y = 318
width = 440
max_height = 600

[[screen]]
frame = "browser"
shot = "docs/screenshots/web/community.png"
address = "ankiquest.example/community"
x = 620
y = 318
width = 440
max_height = 600

[[screen]]
frame = "browser"
shot = "docs/screenshots/web/leaderboard.png"
address = "ankiquest.example/"
